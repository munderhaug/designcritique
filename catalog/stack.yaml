# Build-stack catalog: where "To build this, start with X, add Y" in a critique report comes from.
#
# Every entry names who makes it, how trusted it is, and the sources it was checked against.
# The recommender (scripts/lib/stack.mjs) only picks from this file: it never invents tools.
# Re-verify entries when `verified` is older than ~3 months; this ecosystem changes monthly.
#
# trust: official   = made by the platform or tool owner (Apple, Google, Expo, Figma, Anthropic…)
#        practitioner = a named, established practitioner or firm (e.g. Antoine van der Lee, Callstack)
#        community  = maintained open source without an established author track record
# role (order in the report): foundation, tokens, platform-api, platform-skill, design-skill, design-input, verify
# stacks: swiftui, compose, expo, react-native, flutter, capacitor (web app in a native shell), web (PWA / mobile web)
# group: entries sharing a group are alternatives; the report says "pick one".

verified: 2026-11-17

entries:
  # ---------- 1. Foundation: design system and components ----------
  - id: hig-swiftui
    role: foundation
    name: "Apple HIG with native SwiftUI components"
    by: "Apple"
    trust: official
    platforms: [ios]
    stacks: [swiftui]
    why: "Native controls bring Dynamic Type, dark mode, VoiceOver and platform behaviour for free; the HIG is the yardstick the critique uses."
    install: "Xcode, SwiftUI"
    helps_with: [platform, a11y, typography, color]
    sources:
      - https://developer.apple.com/design/human-interface-guidelines

  - id: material3-compose
    role: foundation
    name: "Material 3 with Jetpack Compose (androidx.compose.material3)"
    by: "Google"
    trust: official
    platforms: [android]
    stacks: [compose]
    why: "Material 3 components, colour roles, type scale and dynamic colour; the conventions the critique checks Android screens against."
    install: "Android Studio, Compose BOM with material3"
    helps_with: [platform, a11y, typography, color, tokens]
    sources:
      - https://m3.material.io
      - https://developer.android.com/develop/ui/compose

  - id: expo-ui
    role: foundation
    group: rn-components
    name: "@expo/ui (real SwiftUI on iOS, Jetpack Compose on Android)"
    by: "Expo"
    trust: official
    platforms: [ios, android]
    stacks: [expo]
    why: "Genuinely native controls from React Native, so screens follow the HIG and Material 3 instead of imitating them."
    install: "npx expo install @expo/ui"
    helps_with: [platform, a11y]
    sources:
      - https://docs.expo.dev/skills/

  - id: rn-reusables
    role: foundation
    group: rn-components
    name: "React Native Reusables (shadcn/ui for React Native, on Nativewind/Uniwind)"
    by: "founded-labs"
    trust: community
    platforms: [ios, android]
    stacks: [expo, react-native]
    why: "Copy-in component source the agent can read and edit, with tokens through Tailwind classes. Cross-platform look rather than native controls."
    install: "see reactnativereusables.com/docs"
    helps_with: [tokens, visual]
    sources:
      - https://github.com/founded-labs/react-native-reusables

  - id: gluestack-ui
    role: foundation
    group: rn-components
    name: "gluestack-ui v5 with its official agent skill"
    by: "gluestack"
    trust: official
    platforms: [ios, android]
    stacks: [expo, react-native]
    why: "Themed, accessible component library; the vendor's agent skill enforces semantic tokens over raw values."
    install: "npx skills add https://github.com/gluestack/agent-skills --skill gluestack-ui-v5"
    helps_with: [tokens, a11y]
    sources:
      - https://skills.sh/gluestack/agent-skills/gluestack-ui-v5

  - id: flutter-widgets
    role: foundation
    name: "Flutter Material 3 and Cupertino widgets"
    by: "Google (Flutter team)"
    trust: official
    platforms: [ios, android]
    stacks: [flutter]
    why: "Material 3 by default, Cupertino widgets where iOS conventions matter."
    install: "flutter create"
    helps_with: [platform, a11y]
    sources:
      - https://docs.flutter.dev/ui/widgets

  # ---------- 2. Tokens ----------
  - id: ionic-framework
    role: foundation
    name: "Ionic Framework components (iOS and Material Design modes)"
    by: "Ionic"
    trust: official
    platforms: [ios, android, web]
    stacks: [capacitor, web]
    why: "Web components that take on iOS styling on iPhone and Material Design on Android, with native-style navigation, sheets, lists and toggles, so a web or Capacitor app follows each platform instead of one web look."
    install: "npm install @ionic/react (or @ionic/vue, @ionic/angular)"
    helps_with: [platform, a11y, layout]
    sources:
      - https://ionicframework.com/docs
      - https://ionicframework.com/docs/theming/platform-styles

  - id: design-md
    role: tokens
    name: "DESIGN.md token file"
    by: "Google Labs"
    trust: official
    platforms: [ios, android, web]
    stacks: [swiftui, compose, expo, react-native, flutter, capacitor, web]
    why: "One file of colour, type, spacing and radius tokens with the reasons behind them, read by coding agents and by designcritique's token checks."
    install: "start from templates/DESIGN.md in this repo, or /impeccable document"
    helps_with: [tokens, color, typography, layout]
    sources:
      - https://github.com/google-labs-code/design.md

  - id: ds-agent-rules
    role: tokens
    name: "Design-system rule in CLAUDE.md"
    by: "Smpl (Andreas Melvær) and Figma"
    trust: practitioner
    platforms: [ios, android, web]
    stacks: [swiftui, compose, expo, react-native, flutter, capacitor, web]
    why: "Tell agents the rules: read DESIGN.md before building any UI, use only its tokens and components, stop and ask when something is missing. Snippet in templates/CLAUDE-design-system.md; Figma's create-design-system-rules skill generates the same kind of rules from your Figma file."
    install: "append templates/CLAUDE-design-system.md to your CLAUDE.md"
    helps_with: [tokens, visual]
    sources:
      - https://smpl.as
      - https://developers.figma.com/docs/figma-mcp-server/skill-create-design-system-rules

  # ---------- Native behaviour in a web view (web and Capacitor apps) ----------
  - id: capacitor-text-zoom
    role: platform-api
    name: "Capacitor Text Zoom plugin"
    by: "Ionic (Capacitor)"
    trust: official
    platforms: [ios, android]
    stacks: [capacitor]
    why: "Reads the user's preferred text size and applies it as the web view's text zoom. iOS WKWebView doesn't follow Dynamic Type by itself; Android's WebView scales text with the system font size unless the app pins it. On iPad it needs preferredContentMode: mobile in the Capacitor config."
    install: "npm install @capacitor/text-zoom && npx cap sync"
    helps_with: [a11y, typography]
    sources:
      - https://capacitorjs.com/docs/apis/text-zoom
      - https://github.com/ionic-team/capacitor-plugins/tree/main/text-zoom

  - id: web-safe-area
    role: platform-api
    name: "Safe-area insets in CSS: env(safe-area-inset-*) with viewport-fit=cover"
    by: "W3C CSS / WebKit"
    trust: official
    platforms: [ios, android, web]
    stacks: [capacitor, web]
    why: "Pads bars by the status bar, notch or Dynamic Island and home indicator. Without viewport-fit=cover in the viewport meta the insets stay 0 on iOS."
    install: "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"> and padding: env(safe-area-inset-top) …"
    helps_with: [layout, platform]
    sources:
      - https://webkit.org/blog/7929/designing-websites-for-iphone-x/
      - https://developer.mozilla.org/en-US/docs/Web/CSS/env

  - id: web-dynamic-type
    role: platform-api
    name: "iOS Dynamic Type in web content (font: -apple-system-body)"
    by: "WebKit"
    trust: official
    platforms: [ios]
    stacks: [capacitor, web]
    why: "Setting the root font to the -apple-system-body text style makes rem-based type follow the iOS text-size setting in Safari and WKWebView; plain web pages, PWAs included, otherwise ignore it."
    install: "html { font: -apple-system-body; } then size type in rem"
    helps_with: [a11y, typography]
    sources:
      - https://webkit.org/blog/3709/using-the-system-font-in-web-content/

  # ---------- 3. Platform skills ----------
  - id: xcode-skills
    role: platform-skill
    name: "Apple's Xcode 27 agent skills (swiftui-specialist and others)"
    by: "Apple"
    trust: official
    platforms: [ios]
    stacks: [swiftui]
    why: "Apple's own SwiftUI guidance, exported for Claude Code. Lacks accessibility and layout guidance, so pair it with one practitioner skill."
    install: "xcrun agent skills export ~/.claude/skills"
    helps_with: [platform]
    sources:
      - https://www.avanderlee.com/ai-development/using-xcode-27s-agent-skills-in-claude-codex-and-cursor/

  - id: swiftui-expert
    role: platform-skill
    group: swiftui-practitioner
    name: "SwiftUI Expert skill"
    by: "Antoine van der Lee (SwiftLee)"
    trust: practitioner
    platforms: [ios]
    stacks: [swiftui]
    why: "State, composition, performance, accessibility and Liquid Glass; version 5 merges Apple's Xcode 27 guidance."
    install: "npx skills@latest add https://github.com/avdlee/swiftui-agent-skill --skill swiftui-expert-skill"
    helps_with: [a11y, platform, layout]
    sources:
      - https://www.avanderlee.com/ai-development/swiftui-best-practices-xcode-27-agent-skill/

  - id: swiftui-pro
    role: platform-skill
    group: swiftui-practitioner
    name: "SwiftUI Pro skill"
    by: "Paul Hudson (Hacking with Swift)"
    trust: practitioner
    platforms: [ios]
    stacks: [swiftui]
    why: "Targets mistakes AI tools repeat: deprecated modifiers, labelled controls, touch targets, scalable fonts, performance."
    install: "npx skills add https://github.com/twostraws/swiftui-agent-skill --skill swiftui-pro"
    helps_with: [a11y, platform]
    sources:
      - https://www.hackingwithswift.com/articles/282/swiftui-agent-skill-claude-codex-ai

  - id: android-skills
    role: platform-skill
    name: "Android skills and Android CLI"
    by: "Google"
    trust: official
    platforms: [android]
    stacks: [compose]
    why: "Official skills for the areas where models underperform (edge-to-edge, XML-to-Compose, Styles API), installed through Android CLI."
    install: "android init && android skills add --agent=claude-code --all"
    helps_with: [platform, layout]
    sources:
      - https://github.com/android/skills
      - https://developer.android.com/tools/agents/android-cli

  - id: material-3-skill
    role: platform-skill
    name: "Material 3 skill"
    by: "hamen"
    trust: community
    platforms: [android]
    stacks: [compose, flutter]
    why: "Material 3 and M3 Expressive tokens, components and a compliance audit, Compose first."
    install: "npx skills add hamen/material-3-skill --skill material-3 -a claude-code"
    helps_with: [platform, tokens, color, typography]
    sources:
      - https://github.com/hamen/material-3-skill

  - id: expo-skills
    role: platform-skill
    name: "Expo plugin skills (expo-design-system, expo-native-ui, expo-ui, expo-router)"
    by: "Expo"
    trust: official
    platforms: [ios, android]
    stacks: [expo]
    why: "Tokens and design-system drift, native styling (HIG, semantic colours, SF Symbols), native navigation; written for apps that look AI-generated."
    install: "claude plugin install expo@claude-plugins-official"
    helps_with: [tokens, platform, visual]
    sources:
      - https://docs.expo.dev/skills/

  - id: callstack-rn
    role: platform-skill
    name: "React Native best practices skills"
    by: "Callstack"
    trust: practitioner
    platforms: [ios, android]
    stacks: [expo, react-native]
    why: "Performance guidance (frame rate, startup) from a major React Native contributor; not visual design."
    install: "/plugin marketplace add callstackincubator/agent-skills, then /plugin install react-native-best-practices@callstack-agent-skills"
    helps_with: []
    sources:
      - https://www.callstack.com/blog/announcing-react-native-best-practices-for-ai-agents

  - id: flutter-plugin
    role: platform-skill
    name: "Flutter and Dart agent plugin (dart-flutter)"
    by: "Google (Flutter and Dart teams)"
    trust: official
    platforms: [ios, android]
    stacks: [flutter]
    why: "Theming, responsive layout, layout fixes, widget previews and an accessibility audit skill, plus the Dart MCP config."
    install: "claude plugin marketplace add flutter/agent-plugins && claude plugin install dart-flutter@dart-flutter"
    helps_with: [a11y, layout, tokens]
    sources:
      - https://github.com/flutter/agent-plugins
      - https://docs.flutter.dev/ai/agent-skills

  # ---------- 4. Design quality (all stacks) ----------
  - id: impeccable
    role: design-skill
    name: "Impeccable"
    by: "Paul Bakaus"
    trust: practitioner
    platforms: [ios, android, web]
    stacks: [swiftui, compose, expo, react-native, flutter, capacitor, web]
    why: "Design vocabulary and anti-pattern rules while building (shape, init, polish, harden, clarify, adapt), with native iOS and Android references."
    install: "npx -y impeccable@{pinned:impeccable} install -y --providers=claude --scope=project --no-hooks"
    helps_with: [visual, ux, content, layout, typography]
    sources:
      - https://github.com/pbakaus/impeccable

  - id: anthropic-design
    role: design-skill
    name: "Anthropic design plugin (design-critique, accessibility-review, ux-copy, design-system)"
    by: "Anthropic"
    trust: official
    platforms: [ios, android, web]
    stacks: [swiftui, compose, expo, react-native, flutter, capacitor, web]
    why: "Structured critique, WCAG audits, interface copy and design-system management while building."
    install: "claude plugin marketplace add anthropics/knowledge-work-plugins && claude plugin install design@knowledge-work-plugins"
    helps_with: [a11y, content, ux, tokens]
    sources:
      - https://github.com/anthropics/knowledge-work-plugins

  # ---------- 5. Design inputs and references ----------
  - id: figma-mcp
    role: design-input
    name: "Figma MCP server (remote) via Figma's Claude Code plugin"
    by: "Figma"
    trust: official
    platforms: [ios, android, web]
    stacks: [swiftui, compose, expo, react-native, flutter, capacitor, web]
    why: "Layout, variables and Code Connect mappings from your Figma files instead of guessing from images."
    install: "claude plugin install figma@claude-plugins-official"
    helps_with: [tokens, visual]
    sources:
      - https://help.figma.com/hc/en-us/articles/39888612464151-Claude-Code-and-Figma-Set-up-the-MCP-server

  - id: mobbin-mcp
    role: design-input
    group: references
    name: "Mobbin MCP"
    by: "Mobbin"
    trust: official
    platforms: [ios, android, web]
    stacks: [swiftui, compose, expo, react-native, flutter, capacitor, web]
    why: "Largest library of shipped iOS and web screens and flows to design and judge key tasks against. No Android library, so Android apps get task patterns only. Paid plans."
    install: "claude mcp add --transport http mobbin https://api.mobbin.com/mcp"
    helps_with: [ux, task-fit, platform]
    sources:
      - https://mobbin.com

  - id: refero-mcp
    role: design-input
    group: references
    name: "Refero MCP"
    by: "Refero"
    trust: official
    platforms: [ios, android, web]
    stacks: [swiftui, compose, expo, react-native, flutter, capacitor, web]
    why: "Real product screens and user flows from websites and iOS apps, plus curated website styles. Smaller than Mobbin; live search needs a paid plan."
    install: "claude mcp add --transport http refero https://api.refero.design/mcp, then sign in from /mcp (the connector alone; Refero's plugin also installs its design skill)"
    helps_with: [ux, task-fit, visual]
    sources:
      - https://doc.refero.design/mcp/getting-started
      - https://github.com/referodesign/refero_skill

  # ---------- 6. Check it on a device ----------
  - id: playwright-devices
    role: verify
    name: "Playwright device emulation"
    by: "Microsoft"
    trust: official
    platforms: [ios, android, web]
    stacks: [web, capacitor]
    why: "Renders the web app at phone sizes, in dark mode and with touch, and screenshots it, so the agent can check its own UI; it's what designcritique uses for HTML. It can't show native shells, keyboards or system text settings."
    install: "npm install -D @playwright/test && npx playwright install chromium"
    helps_with: [visual, layout, a11y]
    sources:
      - https://playwright.dev/docs/emulation

  - id: playwright-cli
    role: verify
    name: "Playwright CLI for coding agents"
    by: "Microsoft"
    trust: official
    platforms: [ios, android, web]
    stacks: [web, capacitor]
    why: "Short commands for an agent to open the app, resize to a phone width, screenshot and look before it says a change is done; lighter on context than the Playwright MCP server. Browser only: it can't show native shells."
    install: "npm install -g @playwright/cli@latest && playwright-cli install --skills"
    helps_with: [visual, layout]
    sources:
      - https://playwright.dev/agent-cli/introduction
      - https://github.com/microsoft/playwright-cli

  - id: capacitor-run
    role: verify
    name: "Capacitor CLI: run on a simulator or device"
    by: "Ionic (Capacitor)"
    trust: official
    platforms: [ios, android]
    stacks: [capacitor]
    why: "Builds and launches the real native shell, so safe areas, the keyboard and the system text size can be checked where the browser can't show them."
    install: "npx cap run ios  /  npx cap run android"
    helps_with: [platform, layout, a11y]
    sources:
      - https://capacitorjs.com/docs/cli/commands/run

  - id: mobilebuildmcp
    role: verify
    name: "MobileBuildMCP (formerly XcodeBuildMCP)"
    by: "Sentry (created by Cameron Cooke)"
    trust: official
    platforms: [ios]
    stacks: [swiftui, expo, react-native, flutter, capacitor]
    why: "Build, run, tap and screenshot on the iOS Simulator so the agent can check its own UI. Note: sends Sentry error telemetry by default (opt-out); renamed from XcodeBuildMCP in v2.7.1 (Sep 2026), so move old .xcodebuildmcp/ configs by hand; the maintainer since Cameron Cooke left Sentry is inferred from release signatures, not announced."
    install: "claude mcp add MobileBuildMCP -- npx -y mobilebuildmcp@latest mcp"
    helps_with: [visual, a11y]
    sources:
      - https://github.com/getsentry/MobileBuildMCP
      - https://github.com/getsentry/MobileBuildMCP/releases

  - id: xcode-mcp
    role: verify
    name: "Xcode 26.3+ built-in MCP (Claude Agent SDK integration)"
    by: "Apple"
    trust: official
    platforms: [ios]
    stacks: [swiftui]
    why: "Xcode's own MCP bridge: Claude Code captures Xcode Previews, searches Apple documentation and iterates on builds without leaving the CLI. Agentic features need macOS 26.2 or later; early versions showed a per-process access prompt and some 401 sign-in issues."
    install: "Xcode 26.3 or later (Settings > Intelligence), then connect Claude Code over MCP as Apple's announcement describes"
    helps_with: [visual, platform]
    sources:
      - https://www.apple.com/newsroom/2026/02/xcode-26-point-3-unlocks-the-power-of-agentic-coding/
      - https://anthropic.com/news/apple-xcode-claude-agent-sdk

  - id: android-cli-verify
    role: verify
    name: "Android CLI previews and emulators"
    by: "Google"
    trust: official
    platforms: [android]
    stacks: [compose]
    why: "Renders Compose @Preview functions to PNG without an emulator, and drives emulators and devices."
    install: "see Android CLI docs"
    helps_with: [visual]
    sources:
      - https://developer.android.com/tools/agents/android-cli

  - id: expo-mcp
    role: verify
    name: "Expo MCP server (local capabilities)"
    by: "Expo"
    trust: official
    platforms: [ios, android]
    stacks: [expo]
    why: "Simulator screenshots, taps and view inspection for Expo apps; docs and EAS on the hosted server."
    install: "npx expo install expo-mcp --dev"
    helps_with: [visual]
    sources:
      - https://expo.dev/changelog/the-expo-mcp-server-is-now-available-on-the-free-plan

  - id: dart-mcp
    role: verify
    name: "Dart and Flutter MCP server"
    by: "Google (Dart team)"
    trust: official
    platforms: [ios, android]
    stacks: [flutter]
    why: "Analyzer, tests and runtime inspection of a running Flutter app. Experimental."
    install: "dart mcp-server (Dart 3.9+)"
    helps_with: [layout]
    sources:
      - https://docs.flutter.dev/ai/tools

  - id: maestro-mcp
    role: verify
    group: cross-platform-ui
    name: "Maestro MCP"
    by: "mobile.dev"
    trust: official
    platforms: [ios, android]
    stacks: [swiftui, compose, expo, react-native, flutter]
    why: "Inspect screens, run and save UI flows on simulators and emulators, cross-platform."
    install: "install the Maestro CLI, then claude mcp add maestro -- maestro mcp"
    helps_with: [ux, task-fit]
    sources:
      - https://maestro.dev/mcp

  - id: mobile-mcp
    role: verify
    group: cross-platform-ui
    name: "mobile-mcp"
    by: "mobile-next"
    trust: community
    platforms: [ios, android]
    stacks: [swiftui, compose, expo, react-native, flutter, capacitor]
    why: "One API for iOS simulators, Android emulators and real devices through accessibility snapshots. Note: sends usage telemetry by default (set MOBILEMCP_DISABLE_TELEMETRY=1 to opt out)."
    install: "claude mcp add mobile-mcp -- npx -y @mobilenext/mobile-mcp@latest"
    helps_with: [a11y]
    sources:
      - https://github.com/mobile-next/mobile-mcp

  - id: agent-device
    role: verify
    group: cross-platform-ui
    name: "agent-device"
    by: "Callstack"
    trust: practitioner
    platforms: [ios, android]
    stacks: [expo, react-native]
    why: "CLI with an MCP mode for iOS and Android: snapshot and ref-based taps, React DevTools profiling, and it handles React Native debug overlays. Strong for React Native and Expo QA flows."
    install: "claude mcp add --transport stdio --scope project agent-device -- agent-device mcp"
    helps_with: [ux, a11y, task-fit]
    sources:
      - https://oss.callstack.com/agent-device/docs/agent-setup
      - https://github.com/callstackincubator/agent-skills/blob/main/docs/ai-assistant-integration.md

  # ---------- While prototyping in HTML (shown only when the critique ran on HTML mockups) ----------
  - id: transitions-dev
    role: prototype
    name: "transitions.dev skills (transitions-dev, transitions-polish)"
    by: "Jakub Antalik"
    trust: practitioner
    platforms: [ios, android]
    stacks: [html]
    why: "36 CSS transitions with motion tokens and reduced-motion guards, plus polish rules (closes faster than opens, no bouncing closes, no delayed dismissals). For HTML prototypes only: in the native app, follow the platform's motion."
    install: "npx skills add Jakubantalik/transitions.dev"
    helps_with: [visual, a11y]
    sources:
      - https://transitions.dev
      - https://github.com/Jakubantalik/transitions.dev

  - id: frontend-design
    role: prototype
    name: "frontend-design skill"
    by: "Anthropic"
    trust: official
    platforms: [ios, android]
    stacks: [html]
    why: "Makes the agent commit to an explicit aesthetic direction (type, colour, motion, layout) before coding, steering away from generic AI defaults. Written for the web: use it for HTML prototypes only, and don't carry web idioms into SwiftUI or Compose."
    install: "/plugin install frontend-design@claude-plugins-official"
    helps_with: [visual, typography, color]
    sources:
      - https://github.com/anthropics/skills

  - id: transitions-agent
    role: prototype
    name: "transitions-agent motion scanner"
    by: "Jakub Antalik"
    trust: practitioner
    platforms: [ios, android]
    stacks: [html]
    why: "Deterministic, local motion score (0-100) with findings for overlays without transitions, missing reduced-motion handling and off-scale timing. designcritique imports its results; the scan needs no account."
    install: "npx transitions-agent --json --dir <mockups folder>"
    helps_with: [visual, a11y]
    sources:
      - https://github.com/Jakubantalik/transitions.dev/tree/main/agent

# Watched, not recommended yet. The recommender never picks these.
watch:
  - id: libraries-dev
    name: "libraries.dev UI effect libraries (border beam, thinking orbs, voice glow, bot avatars, liquid metal)"
