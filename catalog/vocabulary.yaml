  decline: [rechazar, rechazar todo, no gracias, ahora no, omitir, configurar, más tarde]
  shaming: ["re:^no,? gracias[,.]? (yo|prefiero|no)\\b"]
  back: [atrás, volver, cerrar, cancelar, listo, guardar]
  of: de
  states:
    empty: [vacío, nada aquí, aún no hay]
    error: [error, falló, no se pudo]
    loading: [cargando]
    offline: [sin conexión, fuera de línea]
    first-run: [bienvenido, bienvenida, empezar, comenzar]
