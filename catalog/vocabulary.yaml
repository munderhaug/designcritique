  avoid: [slet, fjern, log ud, nulstil, betal, køb, afmeld]
  consent: [nyhedsbrev, markedsføring, tilbud, partnere, tredjeparter, dele mine data, sporing, tilpasset reklame, reklame, cookies]
  accept: [accepter, accepter alle, tillad, jeg accepterer, abonner, ja]
