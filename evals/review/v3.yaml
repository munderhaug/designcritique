# A whole-product review config.
platform: ios
product: PRODUCT.md
design: ../DESIGN.md
content: content-guide.md
output: ../.runs
requires:
  darkMode: true
mockups:
  - id: app
    title: App
    file: v3/index.html
crawl:
  start: app
journeys:
  - id: card-lost
    title: Card lost
    critical: true
    steps: [Card lost or stolen, Freeze card]
  - id: order-card
    title: Order a card
    steps: [Cards, Order new card, Confirm]
