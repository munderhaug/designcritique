<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>App</title>
<style>:root{--surface:#FFFFFF;--on-surface:#16181D;--container:#F3F5F9;--primary:#2457D6;--on-primary:#FFFFFF}@media (prefers-color-scheme: dark){:root{--surface:#121418;--on-surface:#ECEEF3;--container:#1E2128;--primary:#8FB0FF;--on-primary:#0B1F55}}*{box-sizing:border-box;margin:0}body{font:1rem/1.5 system-ui,sans-serif;background:var(--surface);color:var(--on-surface)}header{padding:calc(env(safe-area-inset-top) + .75rem) 1rem .75rem}h1{font-size:1.75rem}main{padding:0 1rem;display:grid;gap:.75rem}.card{background:var(--container);border-radius:.75rem;padding:1rem}button{font:inherit;min-height:2.75rem;border:0;border-radius:.75rem;padding:0 1rem;background:var(--primary);color:var(--on-primary);font-weight:600}</style></head>
<body><header><h1>Monthly summary</h1></header><main><div class="card">See where your money went this month</div><button>Open summary</button></main></body>
</html>
