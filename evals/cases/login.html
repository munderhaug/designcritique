<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px !important; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #FFFFFF; color: #16181D; font-size: 16px; padding: 12px 18px; }
  button, input { font: inherit; border: 0; background: none; }
  .close { width: 28px; height: 28px; border-radius: 999px; background: #F3F5F9; display: grid; place-items: center; }
  .close svg { width: 12px; height: 12px; }
  .close path { stroke: #16181D; stroke-width: 2; }
  h1 { font-size: 30px; font-weight: 800; margin: 30px 0 6px; }
  .sub { color: #A0A4AD; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  .field { display: flex; align-items: center; border: 1px solid #D5D9E2; border-radius: 10px; padding: 0 10px; }
  .field input { flex: 1; height: 46px; font-size: 16px; }
  .eye { width: 24px; height: 24px; }
  .eye circle { fill: #A0A4AD; }
  .primary { width: 100%; height: 50px; margin-top: 26px; border-radius: 10px; background: #FF6A00; color: #FFFFFF; font-size: 17px; font-weight: 700; }
  .forgot { display: block; margin-top: 14px; text-align: center; color: #FF6A00; font-size: 14px; text-decoration: none; }
  .social { display: flex; gap: 10px; width: 420px; margin-top: 30px; }
  .social button { flex: 1; height: 46px; border: 1px solid #D5D9E2; border-radius: 10px; font-size: 15px; color: #16181D; }
  .legal { margin-top: 26px; font-size: 10px; color: #A0A4AD; line-height: 1.4; }
</style>
</head>
<body>
  <button class="close"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
  <h1>Welcome back</h1>
  <p class="sub">Log in to continue to your account</p>

  <label for="email">Email</label>
  <div class="field"><input id="email" type="email" value="ana@example.com"></div>
  <label for="pw">Password</label>
  <div class="field"><input id="pw" type="password" value="hunter22"><button class="eye"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg></button></div>

  <button class="primary">Log in</button>
  <a class="forgot" href="#">Forgot password?</a>

  <div class="social">
    <button>Continue with Apple</button>
    <button>Continue with Google</button>
  </div>

  <p class="legal">By continuing you agree to our Terms of Service and acknowledge our Privacy Policy, including how we use cookies.</p>
</body>
</html>
