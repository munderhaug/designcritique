<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed</title>
<style>
  :root { --surface: #FFFFFF; --on-surface: #16181D; --muted: #5B6170; --container: #F3F5F9; --primary: #2457D6; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #121418; --on-surface: #ECEEF3; --muted: #6B7080; --container: #1E2128; --primary: #8FB0FF; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--surface); color: var(--on-surface); font-size: 1rem; line-height: 1.5; padding-bottom: 6rem; }
  button { font: inherit; color: inherit; border: 0; background: none; }
  .appbar { display: flex; align-items: center; gap: 0.5rem; padding: 2rem 1rem 0.75rem; }
  .appbar h1 { flex: 1; font-size: 1.375rem; font-weight: 400; }
  .icon-btn { width: 2.5rem; height: 2.5rem; border-radius: 999px; display: grid; place-items: center; }
  .icon-btn svg { width: 1.5rem; height: 1.5rem; }
  .icon-btn circle { fill: var(--muted); }
  .post { display: flex; gap: 0.75rem; padding: 0.75rem 1rem; }
  .post img { width: 4rem; height: 4rem; border-radius: 0.5rem; flex: none; background: var(--container); }
  .post .body { min-width: 0; flex: 1; position: relative; min-height: 3rem; }
  .post h2 { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .post p { font-size: 0.875rem; color: var(--muted); position: absolute; top: 24px; left: 0; right: 0; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--container); padding-top: 0.5rem; }
  nav button { flex: 1; min-height: 3.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; font-size: 0.75rem; color: var(--muted); }
  nav button[aria-current="page"] { color: var(--primary); }
  nav svg { width: 1.5rem; height: 1.5rem; }
  nav rect { fill: currentColor; }
</style>
</head>
<body>
  <div class="appbar">
    <h1>Following</h1>
    <button class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/></svg></button>
    <button class="icon-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
  </div>
  <article class="post">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%23D5D9E2'/%3E%3C/svg%3E">
    <div class="body"><h2>Weekend ride along the coastal cliffs north of Porto</h2><p>Marta · 2 h ago · 14 comments</p></div>
  </article>
  <article class="post">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%23D5D9E2'/%3E%3C/svg%3E">
    <div class="body"><h2>New sourdough recipe with a much longer cold proof</h2><p>Jonas · 5 h ago · 3 comments</p></div>
  </article>
  <nav aria-label="Main">
    <button aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>Feed</button>
    <button><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="8"/></svg>Groups</button>
    <button><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>Profile</button>
  </nav>
</body>
</html>
