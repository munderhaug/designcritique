# Smoke test for input types: zip, phone-frame canvas, image. Not scored.
platform: ios
output: ../.runs
mockups:
  - id: onboarding
    file: onboarding.zip
    flow: onboarding
  - id: canvas
    file: canvas.html
    phone_frame: ".phone"
  - id: exported
    file: checkout-export.png
  - id: app
    title: App
    file: spa/index.html
    flow: app
    states:
      - id: home
      - id: settings-saved
        title: Settings, saved
        steps:
          - click: "#open-settings"
          - fill: "#name"
            value: "Ana"
          - click: "text=Save"
          - wait: "#saved"
      - id: help
        title: Help screen
        appearance: dark-only
        steps:
          - goto: "#help"
  - id: app-returning
    title: App, returning user
    file: spa/index.html
    setup: spa/seed.js
journeys:
  - id: settings-save
    title: Save a name
    start: app
    critical: true
    steps: [Settings, { fill: "#name", value: "Ana" }, Save]
  - id: broken
    title: Tap something missing
    start: app
    steps: [Start, Nonexistent button]
