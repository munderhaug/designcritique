# designcritique config. Paths are relative to this file.
platform: ios                 # ios | android | adaptive (checked against both)
product: PRODUCT.md           # problem frame; create with /designcritique:frame
design: DESIGN.md             # optional design tokens (YAML front matter)
references: []                # optional images of what good looks like (Mobbin, Figma, screenshots)
taste: []                     # optional: 9-12 images of the direction you chose (folder or list)
requires:
  darkMode: true              # report a missing dark appearance as a finding
critics:
  judge_model:                # model for the design-reviewer, e.g. fable or opus; best one other
                              # than the model that made the mockups (empty: chosen per run)
  external: []                # extra judges on other tools, e.g. [codex]; see critic-brief.md
gate:
  fail_on: P1                 # not passed while any open finding is this severe (P0-P3, none)
  target_score: 8             # not passed while any key task scores lower (0-10, lowest critic)
iterate:
  max_rounds: 3               # /designcritique:iterate stops after this many rounds
# devices: [compact, standard]          # default; phone sizes per platform
# variants: [light, dark, large-text]   # default
# output: .designcritique/runs          # default

mockups:
  - id: login                 # letters, digits, - and _
    title: Log in
    file: mockups/login.html  # .html, .png/.jpg/.webp, .zip or a folder
    flow: onboarding          # optional: screens of one flow, ordered by step
    step: 1
    notes: "Returning user, task 1 in PRODUCT.md"

  # A Claude artifact: the critique skill pulls it into .designcritique/sources/<id>/ first.
  # - id: home
  #   artifact: https://claude.ai/artifact/XXXXXXXX
  #   phone_frame: ".phone"   # if the page shows several phone frames side by side

  # A single-page app: one page, several screens reached by steps after it loads.
  # Steps: click, fill + value, press, scroll, wait (ms or selector), goto (#hash or ?query), eval (JS).
  # Selectors are Playwright selectors: CSS, text=Settings, role=button[name="Save"].
  # - id: app
  #   file: dist/             # or a .zip; entry: picks the page if there are several
  #   entry: index.html
  #   setup: mockups/seed.js  # optional JS run in the page first (e.g. seed localStorage, then reload)
  #   flow: main
  #   states:
  #     - id: home
  #     - id: settings
  #       steps:
  #         - click: "text=Settings"
  #         - wait: ".settings-list"
  #     - id: emergency
  #       appearance: dark-only # one appearance on purpose: no "missing dark mode" finding
  #       steps:
  #         - goto: "#/help"

  # A zip or folder export: every HTML page (or image) becomes a screen.
  # - id: prototype
  #   file: exports/prototype.zip
  #   entry: index.html       # optional: use just this page

  # Two directions of the same screen, compared by the UI critic.
  # - id: home-a
  #   file: mockups/home-a.html
  #   group: home-directions
  # - id: home-b
  #   file: mockups/home-b.html
  #   group: home-directions
